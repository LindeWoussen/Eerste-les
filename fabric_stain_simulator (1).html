<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stoffen Vlekken Simulator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Permanent Marker & Caveat for natural handwriting -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Permanent+Marker&display=swap" rel="stylesheet">

    <style>
        /* Photorealistic woven fabric background */
        .real-fabric {
            background-color: #f6f3ed;
            background-image: 
                /* Subtle thread weave highlight grid */
                repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.4) 0px, rgba(255, 255, 255, 0.4) 1px, transparent 1px, transparent 3px),
                repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.03) 0px, rgba(0, 0, 0, 0.03) 1px, transparent 1px, transparent 3px),
                /* Diagonal twill weave pattern */
                repeating-linear-gradient(45deg, rgba(0, 0, 0, 0.02) 0px, rgba(0, 0, 0, 0.02) 2px, transparent 2px, transparent 6px),
                repeating-linear-gradient(-45deg, rgba(255, 255, 255, 0.3) 0px, rgba(255, 255, 255, 0.3) 2px, transparent 2px, transparent 6px),
                /* Radial ambient light vignette */
                radial-gradient(circle at 50% 50%, rgba(255,255,255,0.85) 0%, rgba(235,230,220,0.92) 100%);
            background-blend-mode: overlay, multiply, normal, normal, normal;
            box-shadow: inset 0 0 120px rgba(120, 100, 80, 0.08);
        }

        /* Handwritten font styling */
        .handwritten {
            font-family: 'Permanent Marker', 'Caveat', cursive, sans-serif;
            user-select: none;
            line-height: 0.9;
            letter-spacing: -0.01em;
        }

        /* Stain text animation and distortion */
        .stain-text {
            filter: url(#fabric-bleed) opacity(0.98);
            transition: filter 2.5s cubic-bezier(0.16, 1, 0.3, 1), 
                        opacity 2.5s cubic-bezier(0.16, 1, 0.3, 1), 
                        transform 2.5s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: filter, opacity, transform;
            display: inline-block;
            white-space: nowrap;
        }

        /* Rapid soaking state into fabric fibers */
        .stain-soaked {
            filter: url(#fabric-bleed-soaked) blur(2.8px) opacity(0.68) drop-shadow(0 0 10px currentColor);
            transform: scale(1.04) rotate(var(--stain-rot, 0deg));
        }

        /* Pure color dots with hover scaling */
        .dot-btn {
            touch-action: none;
            transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .dot-btn:hover {
            transform: scale(1.22);
        }

        .dot-btn:active {
            transform: scale(0.9);
        }

        /* Washing away animation when resetting */
        @keyframes washClean {
            0% { opacity: 1; filter: blur(0px); transform: scale(1); }
            50% { opacity: 0.4; filter: blur(15px) contrast(140%); transform: scale(1.02); }
            100% { opacity: 0; filter: blur(35px); transform: scale(1); }
        }

        .washing-out {
            animation: washClean 0.9s cubic-bezier(0.4, 0, 0.2, 1) forwards !important;
        }

        /* Water ripple animation when cleaning */
        @keyframes ripple {
            0% { transform: scale(0.2); opacity: 0.7; }
            100% { transform: scale(3.5); opacity: 0; }
        }

        .wash-wave {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(232, 244, 248, 0.8) 0%, rgba(186, 224, 237, 0.3) 60%, transparent 100%);
            pointer-events: none;
            animation: ripple 1s ease-out forwards;
        }
    </style>
</head>
<body class="w-screen h-screen overflow-hidden select-none bg-stone-200 font-sans">

    <!-- SVG Filters for Realistic Fabric Bleed -->
    <svg class="hidden" width="0" height="0">
        <defs>
            <filter id="fabric-bleed">
                <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="3" result="noise" />
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
            </filter>

            <filter id="fabric-bleed-soaked">
                <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="4" result="noise" />
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="12" xChannelSelector="R" yChannelSelector="G" />
            </filter>
        </defs>
    </svg>

    <div id="fabric-canvas" class="relative w-full h-full real-fabric overflow-hidden">

        <!-- Clean Button: Frameless two rotating arrows in #E8F4F8 with high-contrast shadow outline -->
        <button id="clean-btn" title="Schoonmaken" aria-label="Schoonmaken" class="absolute top-8 right-8 z-30 p-3 text-[#E8F4F8] hover:scale-110 hover:rotate-180 active:scale-95 transition-all duration-500 cursor-pointer focus:outline-none filter drop-shadow-[0_3px_8px_rgba(15,23,42,0.4)] drop-shadow-[0_0_2px_rgba(0,0,0,0.6)]">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 sm:w-14 sm:h-14 stroke-current fill-none" viewBox="0 0 24 24" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                <path d="M3 3v5h5"/>
                <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
                <path d="M16 16h5v5"/>
            </svg>
        </button>

        <!-- Layer for Rendered Stains -->
        <div id="stain-container" class="absolute inset-0 pointer-events-none"></div>

        <!-- Palette of Color Dots -->
        <div class="absolute bottom-10 left-10 flex flex-col gap-6 z-30 p-2">
            
            <!-- 1. Soep (#FBC468) -->
            <div class="group relative flex items-center">
                <div class="dot-btn w-12 h-12 rounded-full cursor-grab shadow-md hover:shadow-xl border-2 border-[#E8F4F8] ring-1 ring-black/5"
                     style="background-color: #FBC468;"
                     data-color="#FBC468"
                     data-word="Soep">
                </div>
                <span class="absolute left-16 px-3.5 py-1.5 bg-stone-800 text-white text-xs font-semibold rounded-xl opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap shadow-lg">
                    Soep (#FBC468)
                </span>
            </div>

            <!-- 2. Stylo (#071D41) -->
            <div class="group relative flex items-center">
                <div class="dot-btn w-12 h-12 rounded-full cursor-grab shadow-md hover:shadow-xl border-2 border-[#E8F4F8] ring-1 ring-black/5"
                     style="background-color: #071D41;"
                     data-color="#071D41"
                     data-word="Stylo">
                </div>
                <span class="absolute left-16 px-3.5 py-1.5 bg-stone-800 text-white text-xs font-semibold rounded-xl opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap shadow-lg">
                    Stylo (#071D41)
                </span>
            </div>

            <!-- 3. Koffie (#581E19) -->
            <div class="group relative flex items-center">
                <div class="dot-btn w-12 h-12 rounded-full cursor-grab shadow-md hover:shadow-xl border-2 border-[#E8F4F8] ring-1 ring-black/5"
                     style="background-color: #581E19;"
                     data-color="#581E19"
                     data-word="Koffie">
                </div>
                <span class="absolute left-16 px-3.5 py-1.5 bg-stone-800 text-white text-xs font-semibold rounded-xl opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap shadow-lg">
                    Koffie (#581E19)
                </span>
            </div>

            <!-- 4. Tomatensaus (#FF6237) -->
            <div class="group relative flex items-center">
                <div class="dot-btn w-12 h-12 rounded-full cursor-grab shadow-md hover:shadow-xl border-2 border-[#E8F4F8] ring-1 ring-black/5"
                     style="background-color: #FF6237;"
                     data-color="#FF6237"
                     data-word="Tomatensaus">
                </div>
                <span class="absolute left-16 px-3.5 py-1.5 bg-stone-800 text-white text-xs font-semibold rounded-xl opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap shadow-lg">
                    Tomatensaus (#FF6237)
                </span>
            </div>

        </div>

        <!-- Floating Drag Ghost Element with Live Preview -->
        <div id="drag-ghost" class="fixed pointer-events-none z-50 transform -translate-x-1/2 -translate-y-1/2 hidden flex items-center gap-3">
            <div id="ghost-circle" class="w-10 h-10 rounded-full border-2 border-[#E8F4F8] shadow-2xl opacity-90"></div>
            <span id="ghost-text" class="handwritten text-4xl font-bold opacity-80 filter drop-shadow-md"></span>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const fabricCanvas = document.getElementById('fabric-canvas');
            const stainContainer = document.getElementById('stain-container');
            const dragGhost = document.getElementById('drag-ghost');
            const ghostCircle = document.getElementById('ghost-circle');
            const ghostText = document.getElementById('ghost-text');
            const cleanBtn = document.getElementById('clean-btn');
            const dotButtons = document.querySelectorAll('.dot-btn');

            let activeDrag = null;

            // Register Drag Interaction for Swatches
            dotButtons.forEach(btn => {
                btn.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    
                    const color = btn.getAttribute('data-color');
                    const word = btn.getAttribute('data-word');

                    activeDrag = { color, word };

                    // Update Drag Ghost
                    if (ghostCircle) ghostCircle.style.backgroundColor = color;
                    if (ghostText) {
                        ghostText.textContent = word;
                        ghostText.style.color = color;
                    }

                    if (dragGhost) {
                        dragGhost.style.left = `${e.clientX}px`;
                        dragGhost.style.top = `${e.clientY}px`;
                        dragGhost.classList.remove('hidden');
                    }

                    btn.setPointerCapture(e.pointerId);
                });

                btn.addEventListener('pointermove', (e) => {
                    if (!activeDrag || !dragGhost) return;
                    dragGhost.style.left = `${e.clientX}px`;
                    dragGhost.style.top = `${e.clientY}px`;
                });

                btn.addEventListener('pointerup', (e) => {
                    if (!activeDrag) return;

                    if (btn.hasPointerCapture(e.pointerId)) {
                        btn.releasePointerCapture(e.pointerId);
                    }

                    // Drop stain onto fabric canvas
                    createStain(e.clientX, e.clientY, activeDrag.word, activeDrag.color);

                    if (dragGhost) dragGhost.classList.add('hidden');
                    activeDrag = null;
                });

                btn.addEventListener('pointercancel', () => {
                    if (dragGhost) dragGhost.classList.add('hidden');
                    activeDrag = null;
                });
            });

            function createStain(x, y, word, color) {
                if (!stainContainer) return;

                const stainElem = document.createElement('div');
                stainElem.className = 'absolute transform -translate-x-1/2 -translate-y-1/2 pointer-events-none select-none';
                stainElem.style.left = `${x}px`;
                stainElem.style.top = `${y}px`;

                // Slight natural tilt (-6 deg to +6 deg)
                const randomRotation = (Math.random() - 0.5) * 12;

                const textElem = document.createElement('span');
                textElem.className = 'handwritten stain-text text-8xl sm:text-9xl md:text-[10rem] font-bold tracking-normal';
                textElem.textContent = word;
                textElem.style.color = color;
                textElem.style.setProperty('--stain-rot', `${randomRotation}deg`);
                textElem.style.transform = `rotate(${randomRotation}deg)`;

                stainElem.appendChild(textElem);
                stainContainer.appendChild(stainElem);

                // Trigger rapid fabric fiber absorption
                requestAnimationFrame(() => {
                    setTimeout(() => {
                        textElem.classList.add('stain-soaked');
                    }, 50);
                });
            }

            // Clean reset handler with safety check
            if (cleanBtn) {
                cleanBtn.addEventListener('click', () => {
                    if (!stainContainer) return;
                    const stains = stainContainer.children;
                    if (stains.length === 0) return;

                    // Create water ripple wave effect
                    if (fabricCanvas) {
                        const washWave = document.createElement('div');
                        washWave.className = 'wash-wave inset-0 w-full h-full';
                        fabricCanvas.appendChild(washWave);

                        setTimeout(() => {
                            washWave.remove();
                        }, 1000);
                    }

                    // Animate out stains rapidly
                    Array.from(stains).forEach((stain) => {
                        stain.classList.add('washing-out');
                    });

                    // Clear DOM elements after animation finishes
                    setTimeout(() => {
                        stainContainer.innerHTML = '';
                    }, 850);
                });
            }
        });
    </script>
</body>
</html>
